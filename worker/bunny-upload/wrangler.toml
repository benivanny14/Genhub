# =============================================================================
# GENHUB - Upload proxy (Cloudflare Worker)
#
# Deploy with:   npx wrangler deploy          (from worker/bunny-upload)
# Secrets with:  npx wrangler secret put BUNNY_STREAM_API_KEY
#                npx wrangler secret put BUNNY_UPLOAD_PROXY_SECRET
#
# Read README.md beside this file before changing anything here. The two secrets
# above are the whole security story: BUNNY_STREAM_API_KEY can delete the entire
# library, and BUNNY_UPLOAD_PROXY_SECRET is what stops a stranger using this
# Worker's copy of it. Neither belongs in this file, which is committed.
# =============================================================================

name = "genhub-bunny-upload"
main = "index.ts"

# Pinned so a Worker built today keeps behaving the same way next year; bump it
# deliberately, after re-reading the changelog for runtime changes.
compatibility_date = "2024-11-06"

# This Worker is reached only through the URL Next hands the browser, so it needs
# no route on a domain of ours — the workers.dev address is enough and it is one
# fewer DNS record to get wrong. Set `routes` here instead if it is ever put
# behind api.<domain>.
workers_dev = true

# -----------------------------------------------------------------------------
# Vars — read by name in index.ts, and NOT secret.
# -----------------------------------------------------------------------------
# BUNNY_STREAM_LIBRARY_ID is the Stream library id. It is public on purpose: it
# appears in every playback URL the app serves, and (unlike the API key) it
# grants nothing on its own.
#
# ALLOWED_ORIGINS is the CORS allow-list, comma separated, matched EXACTLY (no
# wildcards). It must name every origin a creator uploads from: the production
# domain and http://localhost:3000 while developing. A missing origin is not a
# security hole — the token still authorizes — but the browser refuses the
# request and the upload fails with a CORS error, which is a confusing way to
# learn that a preview deployment was forgotten.
[vars]
BUNNY_STREAM_LIBRARY_ID = "760553"
ALLOWED_ORIGINS = "https://genhub-two.vercel.app,http://localhost:3000"

# The ceiling for one request body, in bytes. Cloudflare refuses anything over
# 100 MB on the Free and Pro plans BEFORE this Worker runs, so raising it on
# those plans does not help; it is here so a plan upgrade (Business = 200 MB)
# is a one-line change rather than a code change. It must stay at or below
# BUNNY_UPLOAD_PROXY_MAX_BYTES on the Next deployment, or the client will hand
# over a file this Worker then refuses.
# MAX_UPLOAD_BYTES = "104857600"
