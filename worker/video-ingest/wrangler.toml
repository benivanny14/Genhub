# =============================================================================
# GENHUB - Video ingest (Cloudflare Worker)
#
# The last hop of an upload: this Worker reads one object out of the private R2
# bucket and PUTs it into the Bunny slot the server already reserved. It is the
# only place in the system that holds the Bunny library key on this path, and the
# browser never talks to it.
#
# Deploy with:   npx wrangler deploy            (from worker/video-ingest)
# Secret with:   npx wrangler secret put VIDEO_INGEST_SECRET
#                npx wrangler secret put BUNNY_STREAM_API_KEY
#
# Read README.md beside this file before changing anything here. Those two
# secrets are the whole security story: BUNNY_STREAM_API_KEY can delete the
# entire library, and VIDEO_INGEST_SECRET is what stops a stranger using this
# Worker's copy of it. Neither belongs in this file, which is committed.
# =============================================================================

name = "genhub-video-ingest"
main = "index.ts"

# Pinned so a Worker built today keeps behaving the same way next year; bump it
# deliberately, after re-reading the changelog for runtime changes.
compatibility_date = "2024-11-06"

# This Worker is called by the Next server, never by a browser, so it needs no
# route on a domain of ours — the workers.dev address is enough and it is one
# fewer DNS record to get wrong.
workers_dev = true

# -----------------------------------------------------------------------------
# Vars — read by name in index.ts, and NOT secret.
# -----------------------------------------------------------------------------
# BUNNY_STREAM_LIBRARY_ID is the Stream library id. It is public on purpose: it
# appears in every playback URL the app serves, and (unlike the API key) it
# grants nothing on its own.
[vars]
BUNNY_STREAM_LIBRARY_ID = "760553"

# -----------------------------------------------------------------------------
# The bucket. A binding, not credentials: it cannot be used from outside this
# Worker, so the bucket stays private and there is no S3 key to leak here.
# -----------------------------------------------------------------------------
# The name must match R2_BUCKET on the Next deployment, or every ingest fails
# with "Uploaded file not found" — which is a true sentence about the wrong
# bucket, and the first thing to check when it appears.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "genhub-uploads"
