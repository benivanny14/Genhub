# =============================================================================
# GENHUB - Poll video encoding (publish + notify creators when Bunny is ready)
# Calls POST /api/cron/poll-encoding every 5 minutes. Setup required:
#   * Repository variable  APP_URL      — e.g. https://genhub.co.tz
#   * Repository secret    CRON_SECRET  — must match the server's CRON_SECRET
# (The same two values feed release-earnings.yml — configure them once.)
# The job skips cleanly (green) until both are configured.
#
# CADENCE: every 5 minutes, which is the shortest interval GitHub Actions can
# express. Nothing breaks by being slower: the worker is idempotent (publication
# only ever flips unpublished -> published, and a creator is notified at most
# once), and /api/creator/videos also polls a creator's own pending uploads on
# read. The only difference is that a finished encode takes up to 5 minutes to
# surface.
#
# SCHEDULER: this workflow is the only scheduler for this worker. `vercel.json`
# ships an empty `crons` array on purpose — Vercel rejects sub-daily cron
# expressions on the Hobby plan at deploy time, which fails the whole
# deployment. See PRODUCTION.md §4.0.1.
# =============================================================================

name: Poll video encoding

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Call encoding poll endpoint
        env:
          BASE_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "APP_URL repository variable not set — skipping run."
            exit 0
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret not set — skipping run."
            exit 0
          fi
          curl -fsS -X POST "$BASE_URL/api/cron/poll-encoding" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 120
