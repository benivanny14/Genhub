# =============================================================================
# GENHUB - Release matured creator earnings (14-day holding -> available)
# Calls POST /api/cron/release-earnings hourly. Setup required:
#   * Repository variable  APP_URL      — e.g. https://www.genhub-two.site
#   * Repository secret    CRON_SECRET  — must match the server's CRON_SECRET
# The job skips cleanly (green) until both are configured.
#
# THIS WORKFLOW IS THE FREQUENT SCHEDULER for the release job. `vercel.json`
# carries only a single DAILY supervisor cron: Vercel rejects sub-daily cron
# expressions on the Hobby plan *at deploy time*, and that fails the whole
# deployment. So the daily run is the floor, not the cadence — it still runs this
# job when GitHub goes quiet (or disables every schedule after 60 days without
# activity), but up to a day late. Do not delete this file without putting
# another frequent scheduler in its place — nothing else would run the 14-day
# holding release on time, and creators would stop being paid promptly.
# See PRODUCTION.md §4.0.1.
# =============================================================================

name: Release matured earnings

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Call release endpoint
        env:
          BASE_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "APP_URL repository variable not set — skipping run."
            exit 0
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret not set — skipping run."
            exit 0
          fi
          curl -fsS -X POST "$BASE_URL/api/cron/release-earnings" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 60

      # A LOCAL action is read from the runner's workspace, and GitHub only
      # fills that workspace when asked: without this step the job dies in under
      # a second with "Can't find 'action.yml' ... Did you forget to run
      # actions/checkout before running your local action?" — before a single
      # request is made. The long version of why is in supervisor.yml.
      - uses: actions/checkout@v4

      # This delivery is a scarce event (§4.0.4), so it also runs every worker
      # that has fallen behind — including the ones whose own file GitHub has
      # not delivered for hours.
      - name: Run anything the schedule missed
        uses: ./.github/actions/supervise
        with:
          base-url: ${{ vars.APP_URL }}
          cron-secret: ${{ secrets.CRON_SECRET }}
