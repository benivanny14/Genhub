# =============================================================================
# GENHUB - Uptime watchdog
#
# Asks /api/health once an hour and FAILS when the answer is bad, because a
# failed scheduled run is an email to the repository owner and a red mark in the
# Actions tab — an alarm with no account to sign up for.
#
#     node scripts/watchdog.mjs        # the same check, by hand
#
# What it catches that nothing else does: a schedule that stopped firing. No
# request arrives when that happens, so there is no log line, no error and no
# metric — every page still loads while creators stop being paid. The app writes
# a heartbeat per worker so the *absence* of a run is the signal, and this is the
# thing that reads it while nobody has the dashboard open.
#
# No new configuration: it reads `APP_URL`, the repository variable §4.0.1 already
# asks you to set. Set the optional `ALERT_WEBHOOK_URL` secret (a Slack or
# Discord webhook) to get the alarm pushed somewhere you will actually see it,
# instead of only in GitHub's email.
#
# Set `CRON_SECRET` (the secret the four workers already use) and the alarm names
# the worker that stopped, with how long it has been quiet, instead of saying only
# "background jobs: late". It also lets the watchdog START that worker again —
# through the worker's own cron route, so the run takes the same lock and stamps
# the same heartbeat, and renew-subscriptions is never among them because it can
# send a charge request to a customer's phone. Optional in both directions:
# without it the alert is what it was, and a wrong or rotated value cannot stop
# the alarm — the detail and the restart are attempted only after the verdict is
# already bad, and any failure leaves the message alone.
#
# To stop the automatic restarts and keep the alarm, set the repository VARIABLE
# `WATCHDOG_RECOVER=off`. Unset means on; anything unrecognised means off.
#
# -----------------------------------------------------------------------------
# The blind spot, which is why §4.0.2 also recommends a monitor outside GitHub
#
# GitHub disables *every* scheduled workflow in a repository after 60 days
# without activity — this one included, at the same moment as the four workers it
# is watching. So it cannot report the one failure that also silences it. For
# that, point any free uptime monitor at /api/health: the endpoint answers 503
# when the jobs have gone quiet, and a monitor is not hosted in the repository
# that went quiet.
# =============================================================================

name: Uptime watchdog

on:
  schedule:
    # Minute 45: clear of the workers (release :00, renew :15, reconcile every
    # 10, encoding every 5), so a run that is seconds late is not mistaken for
    # one that never happened.
    - cron: "45 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Check the health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # Optional: turns "background jobs: late" into the worker's name and how
          # long it has been silent, and lets the watchdog restart it. See the
          # header.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Optional: "off" stops the automatic restarts, keeping the alarm.
          WATCHDOG_RECOVER: ${{ vars.WATCHDOG_RECOVER }}
        run: node scripts/watchdog.mjs
