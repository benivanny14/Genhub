# =============================================================================
# GENHUB - Video encoding state
# Calls POST /api/cron/video-encoding every 10 minutes. The worker is bounded
# (nine videos, three Bunny lookups at a time) and idempotent, so a delivery
# that arrives late simply finds fewer videos left to refresh.
#
# WHY THIS FILE EXISTS. Bunny calls us the instant an encode finishes, and that
# callback is the source of truth — but a callback can be missed (Bunny retries,
# then gives up), can arrive before the video row is written, or can answer 5xx
# transiently. Without a pull path a post stays marked "Inachakatwa..." forever,
# which is the one failure the creator can see and nobody can explain.
#
# Setup required (the same two values every other worker workflow reads):
#   * Repository variable  APP_URL      — e.g. https://www.genhub-two.site
#   * Repository secret    CRON_SECRET  — must match the server's CRON_SECRET
# The job skips cleanly (green) until both are configured.
#
# This file is not the only way the sweep runs: /api/cron/supervisor runs it
# too, because a safe worker left out of the supervisor is one that silently
# stops when its own file is not delivered (see §4.0.4). This file is the
# dedicated poke; the supervisor is the safety net.
# =============================================================================

name: Video encoding refresh

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call encoding refresh endpoint
        env:
          BASE_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "APP_URL repository variable not set — skipping run."
            exit 0
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret not set — skipping run."
            exit 0
          fi
          curl -fsS -X POST "$BASE_URL/api/cron/video-encoding" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 60

      # A LOCAL action is read from the runner's workspace, and GitHub only
      # fills that workspace when asked: without this step the job dies in under
      # a second with "Can't find 'action.yml' ... Did you forget to run
      # actions/checkout before running your local action?" — before a single
      # request is made. The long version of why is in supervisor.yml.
      - uses: actions/checkout@v4

      # Same scarce-delivery trick as the other worker workflows: this run also
      # pokes every worker that has fallen behind.
      - name: Run anything the schedule missed
        uses: ./.github/actions/supervise
        with:
          base-url: ${{ vars.APP_URL }}
          cron-secret: ${{ secrets.CRON_SECRET }}
