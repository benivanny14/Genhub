# =============================================================================
# GENHUB - Renew subscriptions before they lapse
# Calls POST /api/cron/renew-subscriptions hourly (at :15). Setup required:
#   * Repository variable  APP_URL      — e.g. https://www.genhub-two.site
#   * Repository secret    CRON_SECRET  — must match the server's CRON_SECRET
# (The same two values feed release-earnings.yml — configure them once.)
# The job skips cleanly (green) until both are configured.
#
# :15 rather than :00 on purpose — release-earnings fires on the hour and both
# workers touch creator balances, so they are kept off the same minute.
#
# The job is idempotent by design: at most one charge attempt per RETRY_GAP and
# MAX_RENEW_ATTEMPTS per period, so a delayed or duplicated run cannot double
# charge a fan.
#
# SCHEDULER: this workflow is the ONLY scheduler for this worker, and the daily
# Vercel cron does not change that: it pokes /api/cron/supervisor, and the
# supervisor deliberately never starts `renew-subscriptions` on its own (it can
# send a USSD charge request to a fan's phone — §4.0.4). `vercel.json` carries
# only that single DAILY cron because sub-daily expressions fail a Hobby
# deployment at deploy time. See PRODUCTION.md §4.0.1.
# =============================================================================

name: Renew subscriptions

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Call renewal endpoint
        env:
          BASE_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "APP_URL repository variable not set — skipping run."
            exit 0
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret not set — skipping run."
            exit 0
          fi
          # 300s: this batch sends SonicPesa USSD pushes, which are slower than
          # a status lookup and are the reason this worker is hourly.
          curl -fsS -X POST "$BASE_URL/api/cron/renew-subscriptions" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 300

      # A LOCAL action is read from the runner's workspace, and GitHub only
      # fills that workspace when asked: without this step the job dies in under
      # a second with "Can't find 'action.yml' ... Did you forget to run
      # actions/checkout before running your local action?" — before a single
      # request is made. The long version of why is in supervisor.yml.
      - uses: actions/checkout@v4

      # This delivery also runs every worker that has fallen behind (§4.0.4).
      # Renewals themselves are NOT run by the supervisor — only here, on their
      # own schedule, because a second USSD charge on a fan's phone is the one
      # thing that cannot be taken back.
      - name: Run anything the schedule missed
        uses: ./.github/actions/supervise
        with:
          base-url: ${{ vars.APP_URL }}
          cron-secret: ${{ secrets.CRON_SECRET }}
