# =============================================================================
# GENHUB - The cron supervisor
# Calls POST /api/cron/supervisor, which runs every worker whose heartbeat is
# past its own budget. Setup required (the same two values the worker
# workflows already read):
#   * Repository variable  APP_URL      — e.g. https://genhub.co.tz
#   * Repository secret    CRON_SECRET  — must match the server's CRON_SECRET
# The job skips cleanly (green) until both are configured.
#
# WHY THIS FILE EXISTS. GitHub Actions does not keep the intervals the worker
# workflows ask for. Measured on this repository over 24 h: reconcile-payments
# (`*/10`) was delivered every 137-336 minutes, and the hourly ones every
# 3h19-5h36. (The `*/5` encoding poll that was part of that
# measurement has since been removed — video readiness is pushed by Bunny, see
# PRODUCTION.md §3.2.) Each worker
# therefore only ran when its own file happened to arrive, and its heartbeat sat
# past the budget in between — so `backgroundJobs` read `late` for most of the
# day and money-moving work was hours late with nothing actually broken.
#
# One poke that runs everything overdue turns any delivery into a full round of
# the workers, so the worker workflows end with the same step as this file
# does — one shared composite action. That is also what makes an external
# scheduler (cron-job.org, or Vercel Cron on Pro) a complete fix rather than a
# partial one: point it here, every 5 minutes, and every worker's real cadence
# becomes 5 minutes without touching a single one of their own files.
# See PRODUCTION.md §4.0.4.
#
# `renew-subscriptions` is deliberately NOT run by the supervisor — it can send
# a USSD charge request to a fan's phone. The response names it as held, with the
# reason, and Admin → Background jobs can run it by hand.
# =============================================================================

name: Cron supervisor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      # THE LONG VERSION of why this step exists — every other workflow that
      # calls ./.github/actions/supervise carries a one-line pointer to here.
      #
      # A local action (`uses: ./path`) is read from the RUNNER'S WORKSPACE, and
      # GitHub does not put anything there unless `actions/checkout` asks it to.
      # Without this step the run fails in under a second, before a single
      # request is made, with:
      #
      #   Can't find 'action.yml', 'action.yaml' or 'Dockerfile' under
      #   '.../.github/actions/supervise'. Did you forget to run actions/checkout
      #   before running your local action?
      #
      # That is what every scheduled run of this repository looked like: every
      # worker and this file all red while the endpoints behind them were
      # healthy, `backgroundJobs` read `never`, and the watchdog's alarm was the
      # only thing telling the truth. Nothing inside the app is broken by this —
      # it is a workflow that cannot start.
      #
      # `contents: read` above is the only permission a checkout needs, and it is
      # stated rather than inherited so the requirement is visible next to the
      # step that has it.
      - uses: actions/checkout@v4

      # The same step the worker workflows end with, so the guard and the
      # endpoint have one home: .github/actions/supervise/action.yml
      - name: Run whatever the schedule missed
        uses: ./.github/actions/supervise
        with:
          base-url: ${{ vars.APP_URL }}
          cron-secret: ${{ secrets.CRON_SECRET }}
