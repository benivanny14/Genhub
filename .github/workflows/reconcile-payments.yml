# =============================================================================
# GENHUB - Reconcile stale payments (gateway status + UNDER_INVESTIGATION)
# Calls POST /api/cron/reconcile-payments every 10 minutes. Setup required:
#   * Repository variable  APP_URL      — e.g. https://genhub.co.tz
#   * Repository secret    CRON_SECRET  — must match the server's CRON_SECRET
# (The same two values feed release-earnings.yml — configure them once.)
# The job skips cleanly (green) until both are configured.
#
# This endpoint asks the gateway about charges that never settled, so it is the
# one that surfaces "the customer paid but we were never told". It must run
# reliably: a payment left unresolved is a customer who paid and got nothing.
#
# SCHEDULER: this workflow is the only scheduler for this worker. `vercel.json`
# ships an empty `crons` array on purpose — Vercel rejects sub-daily cron
# expressions on the Hobby plan at deploy time, which fails the whole
# deployment. See PRODUCTION.md §4.0.1.
# =============================================================================

name: Reconcile stale payments

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Call reconcile endpoint
        env:
          BASE_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "APP_URL repository variable not set — skipping run."
            exit 0
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret not set — skipping run."
            exit 0
          fi
          # 120s: a batch of gateway lookups, not a single call.
          curl -fsS -X POST "$BASE_URL/api/cron/reconcile-payments" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 120
